name: Build App

on:
  workflow_dispatch:
    inputs:
      build_configuration:
        description: Build Configuration
        required: false
        type: string
        default: Release
      upload_artifact:
        description: Upload artifact
        required: false
        type: boolean
        default: true
  workflow_call:
    inputs:
      build_configuration:
        required: false
        type: string
        default: Release
      upload_artifact:
        required: false
        type: boolean
        default: true
    secrets:
      CURSE_FORGE_API_KEY:
        required: false
      MACOS_CERTIFICATE:
        required: false
      MACOS_CERTIFICATE_PASSWORD:
        required: false
      MACOS_SIGNING_IDENTITY:
        required: false
      MACOS_SIGNING_TEAM:
        required: false

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set version
        run: echo "BUILD_NUMBER=$(git rev-list --count HEAD)" >> $GITHUB_ENV

      - name: Generate Secrets.properties
        env:
          CURSE_FORGE_API_KEY: ${{ secrets.CURSE_FORGE_API_KEY }}
        run: |
          # 仓库里的 Secrets.properties 只是模板。没配 secret 时不要写出
          # "CURSE_FORGE_API_KEY="（空值）这种行：PropertiesLoader 以前会因此
          # 让整份文件解析失败，表现为"所有 Key 都没了"（Issue #4）。
          if [ -n "$CURSE_FORGE_API_KEY" ]; then
            printf 'CURSE_FORGE_API_KEY=%s\n' "$CURSE_FORGE_API_KEY" > ./Resources/Secrets.properties
            echo "CurseForge API Key: 已注入"
          else
            echo "::warning title=缺少 CURSE_FORGE_API_KEY::仓库 secret 未配置，打出来的 App 不含 CurseForge API Key，CurseForge 整合包将无法导入（用户仍可在 设置 → 其他 → 社区资源 手填）。"
            : > ./Resources/Secrets.properties
          fi

      - name: Import codesign cert
        if: ${{ inputs.build_configuration == 'Release' }}
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.MACOS_CERTIFICATE }}
          p12-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}

      - name: Build app
        run: |
          echo "Build number: $BUILD_NUMBER"

          # 与本地保持一致：装了 Swift 6.4 就用它，否则回退 Xcode 自带工具链
          # （源码用了 6.1+ 的语法，Xcode 自带的 6.0 编不过）。
          SWIFTC=""
          if [ -x /Library/Developer/Toolchains/swift-latest.xctoolchain/usr/bin/swiftc ]; then
            SWIFTC=/Library/Developer/Toolchains/swift-latest.xctoolchain/usr/bin/swiftc
          elif [ -x /Applications/Xcode.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin/swiftc ]; then
            SWIFTC=/Applications/Xcode.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin/swiftc
          fi

          TOOLCHAIN_ARGS=()
          if [ -n "$SWIFTC" ]; then
            echo "swiftc: $SWIFTC"
            "$SWIFTC" --version | head -1
            TOOLCHAIN_ARGS=(SWIFT_EXEC="$SWIFTC")
          fi

          COMMON_ARGS=(
            -project PCL.Swift.xcodeproj
            -scheme PCL.Swift
            -configuration "${{ inputs.build_configuration }}"
            CURRENT_PROJECT_VERSION=$BUILD_NUMBER
            -archivePath build
            "${TOOLCHAIN_ARGS[@]+"${TOOLCHAIN_ARGS[@]}"}"
          )

          if [ "${{ inputs.build_configuration }}" = "Release" ]; then
            xcodebuild archive \
              "${COMMON_ARGS[@]}" \
              CODE_SIGN_STYLE=Manual \
              CODE_SIGN_IDENTITY="${{ secrets.MACOS_SIGNING_IDENTITY }}" \
              DEVELOPMENT_TEAM="${{ secrets.MACOS_SIGNING_TEAM }}" \
              ENABLE_HARDENED_RUNTIME=YES
          else
            xcodebuild archive \
              "${COMMON_ARGS[@]}"
          fi

      - name: Prepare app artifact
        run: |
          mkdir "PCL.Swift-artifact"
          ditto ./build.xcarchive/Products/Applications/PCL.Swift.app ./PCL.Swift-artifact/PCL.Swift.app
          ditto ./build.xcarchive ./PCL.Swift-artifact/build.xcarchive
          ditto -c -k --sequesterRsrc ./PCL.Swift-artifact ./PCL.Swift-artifact.zip

      - name: Upload app artifact
        if: ${{ inputs.upload_artifact }}
        uses: actions/upload-artifact@v7
        with:
          name: PCL.Swift-artifact
          path: ./PCL.Swift-artifact.zip
          archive: false
name: Build and release

on:
  workflow_dispatch:
    inputs:
      sign_app:
        description: Sign with Developer ID and notarize (needs MACOS_* secrets)
        required: false
        type: boolean
        # 默认 ad-hoc：仓库目前没有配置 MACOS_CERTIFICATE 一类的 secret，
        # 打开它会在 import-codesign-certs 那一步直接失败（"At least one of
        # p12-filepath or p12-file-base64 must be provided"）。
        # 要出正式签名包时把 secret 配齐，再用 sign_app=true 手动跑一次。
        default: false

permissions:
  contents: write
  # 取 artifact 的原始字节要读 Actions 的产物列表，光有 contents 会被 403。
  actions: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # 2.0.4 起按架构分开出包，不再打通用二进制：
        # 通用包里总有一半代码用不上，体积也大一倍。
        arch: [arm64, x86_64]
    uses: ./.github/workflows/build.yml
    with:
      build_configuration: Release
      upload_artifact: true
      arch: ${{ matrix.arch }}
      sign_app: ${{ inputs.sign_app }}
    secrets: inherit

  release:
    # 与 build.yml 一致：xcode-27 镜像（macOS 27 + Xcode 27）。
    # 公证只在 sign_app=true 时做：ad-hoc 签名的包过不了 notarytool。
    runs-on: xcode-27
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get version
        run: |
          echo "BUILD_NUMBER=$(git rev-list --count HEAD)" >> $GITHUB_ENV
          VERSION_NUMBER=$(grep '^MARKETING_VERSION' Configs/Base.xcconfig | cut -d '=' -f2 | xargs)
          echo "VERSION_NUMBER=$VERSION_NUMBER" >> $GITHUB_ENV
          echo "TAG_NAME=v$VERSION_NUMBER" >> $GITHUB_ENV

      - name: Download artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p artifact
          # 绝对不能用 actions/download-artifact（或 gh run download）：它们用 Node / Go 的
          # unzip 解包，会把框架里的 Versions/Current 符号链接写成普通文件，重新打包后
          # 签名当场作废——2.2.0 的包就是这么坏的，用户更新后只看到「应用程序无法打开」。
          # 这里直接取 artifact 的 zip 原始字节，再用 ditto 解，符号链接才保得住。
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
            --jq '.artifacts[] | select(.name | startswith("PCL.Swift-artifact-")) | "\(.id) \(.name)"' |
          while read -r id name; do
            echo "下载 $name（artifact $id）"
            curl -sSL --fail \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -o "artifact/wrapper-$id.zip" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip"
            # 每个架构解到自己那层目录：两个产物的内容同名（PCL.Swift.app / build.xcarchive），
            # 解到同一层会互相覆盖。ditto 解出来的符号链接是完好的（已实测）。
            mkdir -p "artifact/$name"
            ditto -x -k "artifact/wrapper-$id.zip" "artifact/$name"
            rm -f "artifact/wrapper-$id.zip"
          done
          ls -l artifact

      - name: Package each architecture
        env:
          SIGN_APP: ${{ inputs.sign_app }}
        run: |
          set -euo pipefail
          for arch in arm64 x86_64; do
            echo "::group::$arch"
            # 上一步已经用 ditto 解到 ./artifact/<产物名>/ 下，这里直接用，别再解一次。
            app="./artifact/PCL.Swift-artifact-$arch.zip/PCL.Swift.app"
            test -d "$app" || { echo "::error::找不到 $app"; ls -R ./artifact | head -40; exit 1; }
            # 守卫：框架里的 Current 必须是符号链接、签名必须验得过，否则这个包一定起不来。
            test -L "$app/Contents/Frameworks/Core.framework/Versions/Current" || {
              echo "::error::Core.framework/Versions/Current 不是符号链接，产物已损坏"; exit 1; }
            codesign --verify --deep --strict "$app" || { echo "::error::签名校验失败"; exit 1; }
            echo "arch in bundle: $(lipo -archs "$app/Contents/MacOS/PCL.Swift")"

            if [ "$SIGN_APP" = "true" ]; then
              # 先压一份提交公证；公证通过后 staple，再重新压最终资产。
              ditto -c -k --sequesterRsrc --keepParent "$app" "PCL.Swift-$VERSION_NUMBER-$arch.zip"
              xcrun notarytool submit "PCL.Swift-$VERSION_NUMBER-$arch.zip" \
                --apple-id "${{ secrets.MACOS_NOTARY_APPLE_ID }}" \
                --password "${{ secrets.MACOS_NOTARY_PASSWORD }}" \
                --team-id "${{ secrets.MACOS_SIGNING_TEAM }}" \
                --wait
              xcrun stapler staple "$app"
              rm -f "PCL.Swift-$VERSION_NUMBER-$arch.zip"
            fi

            ditto -c -k --sequesterRsrc --keepParent "$app" "PCL.Swift-$VERSION_NUMBER-$arch.zip"

            rm -rf "dmg-$arch" && mkdir "dmg-$arch"
            ditto "$app" "dmg-$arch/PCL.Swift.app"
            ditto Packaging/DS_Store "dmg-$arch/.DS_Store"
            ln -s /Applications "dmg-$arch/将左边的 App 拖至此处"
            mkdir -p "dmg-$arch/.background"
            cp Packaging/background.png "dmg-$arch/.background/background.png"
            hdiutil create -volname "PCL.Swift" -srcfolder "dmg-$arch" -ov -format UDZO \
              "PCL.Swift-$VERSION_NUMBER-$arch.dmg"
            echo "::endgroup::"
          done

      - name: Create release
        run: |
          # x86_64 先传：2.0.3 及更早的更新器不区分架构、只取第一个 zip，
          # Intel 包在 Apple Silicon 上还能靠 Rosetta 跑，反过来不行。
          gh release create $TAG_NAME \
            "PCL.Swift-$VERSION_NUMBER-x86_64.zip" \
            "PCL.Swift-$VERSION_NUMBER-x86_64.dmg" \
            "PCL.Swift-$VERSION_NUMBER-arm64.zip" \
            "PCL.Swift-$VERSION_NUMBER-arm64.dmg" \
            --title $VERSION_NUMBER \
            --generate-notes \
            --draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 把产物与清单推到国内分发仓库（GitCode）。
  #
  # 只做「复制到国内」：GitHub Release 仍然是构建与发布的事实来源，
  # 这一步失败不会影响 GitHub 上的产物，但会让国内用户拿不到新版本，
  # 所以它跑在 release 之后并且不吞错。
  publish-dist:
    needs: release
    if: ${{ needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve version
        run: |
          VERSION=$(grep '^MARKETING_VERSION' Configs/Base.xcconfig | cut -d '=' -f2 | xargs)
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"
          echo "发布版本：v$VERSION"

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p assets
          # 只取两个更新包；dmg 与 build.xcarchive.zip 不进分发仓库。
          gh release download "$TAG" --pattern 'PCL.Swift-*.zip' --dir assets
          ls -l assets

      - name: Publish manifest and packages
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
          TAG: ${{ env.TAG }}
        run: Scripts/publish-dist.sh

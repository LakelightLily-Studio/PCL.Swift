name: Build and release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # 2.0.4 起按架构分开出包，不再打通用二进制：
        # 通用包里总有一半代码用不上，体积也大一倍。
        arch: [arm64, x86_64]
    uses: ./.github/workflows/build.yml
    with:
      build_configuration: Release
      upload_artifact: true
      arch: ${{ matrix.arch }}
    secrets: inherit

  release:
    runs-on: macos-26
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get version
        run: |
          echo "BUILD_NUMBER=$(git rev-list --count HEAD)" >> $GITHUB_ENV
          VERSION_NUMBER=$(grep '^MARKETING_VERSION' Configs/Base.xcconfig | cut -d '=' -f2 | xargs)
          echo "VERSION_NUMBER=$VERSION_NUMBER" >> $GITHUB_ENV
          echo "TAG_NAME=v$VERSION_NUMBER" >> $GITHUB_ENV

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: PCL.Swift-artifact-*.zip
          path: ./artifact
          merge-multiple: true

      - name: Notarize and package each architecture
        run: |
          set -euo pipefail
          # 解压必须用 ditto：它保留框架里的 Versions/Current 符号链接，
          # 用普通 unzip 会把链接解成普通文件，签名当场作废。
          for arch in arm64 x86_64; do
            echo "::group::$arch"
            work="work-$arch"
            rm -rf "$work"
            ditto -x -k "./artifact/PCL.Swift-artifact-$arch.zip" "$work"
            app="$work/PCL.Swift.app"
            echo "arch in bundle: $(lipo -archs "$app/Contents/MacOS/PCL.Swift")"

            # 先压一份提交公证；公证通过后 staple，再重新压最终资产。
            ditto -c -k --sequesterRsrc --keepParent "$app" "PCL.Swift-$VERSION_NUMBER-$arch.zip"
            xcrun notarytool submit "PCL.Swift-$VERSION_NUMBER-$arch.zip" \
              --apple-id "${{ secrets.MACOS_NOTARY_APPLE_ID }}" \
              --password "${{ secrets.MACOS_NOTARY_PASSWORD }}" \
              --team-id "${{ secrets.MACOS_SIGNING_TEAM }}" \
              --wait
            xcrun stapler staple "$app"
            rm -f "PCL.Swift-$VERSION_NUMBER-$arch.zip"
            ditto -c -k --sequesterRsrc --keepParent "$app" "PCL.Swift-$VERSION_NUMBER-$arch.zip"

            rm -rf "dmg-$arch" && mkdir "dmg-$arch"
            ditto "$app" "dmg-$arch/PCL.Swift.app"
            ditto Packaging/DS_Store "dmg-$arch/.DS_Store"
            ln -s /Applications "dmg-$arch/将左边的 App 拖至此处"
            mkdir -p "dmg-$arch/.background"
            cp Packaging/background.png "dmg-$arch/.background/background.png"
            hdiutil create -volname "PCL.Swift" -srcfolder "dmg-$arch" -ov -format UDZO \
              "PCL.Swift-$VERSION_NUMBER-$arch.dmg"
            echo "::endgroup::"
          done

      - name: Create release
        run: |
          # x86_64 先传：2.0.3 及更早的更新器不区分架构、只取第一个 zip，
          # Intel 包在 Apple Silicon 上还能靠 Rosetta 跑，反过来不行。
          gh release create $TAG_NAME \
            "PCL.Swift-$VERSION_NUMBER-x86_64.zip" \
            "PCL.Swift-$VERSION_NUMBER-x86_64.dmg" \
            "PCL.Swift-$VERSION_NUMBER-arm64.zip" \
            "PCL.Swift-$VERSION_NUMBER-arm64.dmg" \
            --title $VERSION_NUMBER \
            --generate-notes \
            --draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 把产物与清单推到国内分发仓库（GitCode）。
  #
  # 只做「复制到国内」：GitHub Release 仍然是构建与发布的事实来源，
  # 这一步失败不会影响 GitHub 上的产物，但会让国内用户拿不到新版本，
  # 所以它跑在 release 之后并且不吞错。
  publish-dist:
    needs: release
    if: ${{ needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve version
        run: |
          VERSION=$(grep '^MARKETING_VERSION' Configs/Base.xcconfig | cut -d '=' -f2 | xargs)
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"
          echo "发布版本：v$VERSION"

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p assets
          # 只取两个更新包；dmg 与 build.xcarchive.zip 不进分发仓库。
          gh release download "$TAG" --pattern 'PCL.Swift-*.zip' --dir assets
          ls -l assets

      - name: Publish manifest and packages
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
          TAG: ${{ env.TAG }}
        run: Scripts/publish-dist.sh


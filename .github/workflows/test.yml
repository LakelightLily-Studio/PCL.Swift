name: Run Tests
on:
  # main 上的每次合入都跑一遍；PR 由 pr-test.yml 负责，避免同一次提交跑两遍。
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      xcode_27:
        description: "macOS 27 (Xcode 27)"
        type: boolean
        default: true
      macos_15:
        description: "macOS 15"
        type: boolean
        default: false

jobs:
  test_xcode_27:
    name: Test on macOS 27 (Xcode 27)
    # 手动触发时仍按输入决定；push 事件没有 inputs，默认执行。
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.xcode_27 == 'true' }}
    # 与 build.yml 一致：xcode-27 镜像（macOS 27 + Xcode 27）。
    runs-on: xcode-27
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      
      - name: Run tests
        run: |
          set +e

          # 统一走项目脚本：装了 Swift 6.4 就用它，否则回退 Xcode 自带工具链。
          Scripts/xcodebuild-swift.sh test Debug "" -resultBundlePath ./result.xcresult
          
          exit_code=$?
          echo "TEST_EXIT_CODE=$exit_code" >> "$GITHUB_ENV"

          set -e
        continue-on-error: true
      
      - name: Upload result
        uses: actions/upload-artifact@v7
        with:
          name: xcode-27.xcresult
          path: result.xcresult
      
      - name: Fail job if tests failed
        run: |
          exit_code="${TEST_EXIT_CODE:-0}"
          exit "${exit_code}"

  test_macos_15:
    name: Test on macOS 15
    if: ${{ github.event.inputs.macos_15 == 'true' }}
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      
      - name: Run tests
        run: |
          set +e

          Scripts/xcodebuild-swift.sh test Debug "" -resultBundlePath ./result.xcresult
          
          exit_code=$?
          echo "TEST_EXIT_CODE=$exit_code" >> "$GITHUB_ENV"

          set -e
        continue-on-error: true
      
      - name: Upload result
        uses: actions/upload-artifact@v7
        with:
          name: macos-15.xcresult
          path: result.xcresult
      
      - name: Fail job if tests failed
        run: |
          exit_code="${TEST_EXIT_CODE:-0}"
          exit "${exit_code}"
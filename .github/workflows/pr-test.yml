name: PR Test

on:
  pull_request:
    paths:
      - "Configs/**"
      - ".github/workflows/**"
      - "PCL.Swift/**"
      - "PCL.Swift.Core/**"
      - "PCL.Swift.Tests/**"
      - "PCL.Swift.xcodeproj/**"
      - "Resources/**"

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      build_configuration: Debug
      upload_artifact: false
    secrets: inherit

  test:
    runs-on: macos-26
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run tests
        # 统一走 Scripts/xcodebuild-swift.sh：它会挑可用工具链（装了 Swift 6.4 就用，
        # 没有就退回 Xcode 自带）。runner 上通常没有 6.4，这里同样能跑通。
        run: |
          Scripts/xcodebuild-swift.sh test

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr-test.xcresult
          path: result.xcresult

name: PR Test

on:
  pull_request:
    paths:
      - "Configs/**"
      - ".github/workflows/**"
      - "PCL.Swift/**"
      - "PCL.Swift.Core/**"
      - "PCL.Swift.Tests/**"
      - "PCL.Swift.xcodeproj/**"
      - "Resources/**"

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      build_configuration: Debug
      upload_artifact: false
    secrets: inherit

  test:
    # 与 build.yml 一致：xcode-27 镜像（macOS 27 + Xcode 27）。
    runs-on: xcode-27
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run tests
        # 统一走 Scripts/xcodebuild-swift.sh：它会挑可用工具链（装了 Swift 6.4 就用，
        # 没有就退回 Xcode 自带）。xcode-27 镜像上通常没有 6.4 工具链，Xcode 27 自带的 swiftc 同样编得过。
        run: |
          Scripts/xcodebuild-swift.sh test

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr-test.xcresult
          path: result.xcresult
